# Contrato de features v0 — PET/IDS 7
# Medido em Dataset_completo.csv (368.017 x 29) e Dataset_resumido.csv (55.826 x 25).
# Fonte das medicoes: scripts/inspeciona_dataset.py e docs/inspecao_dataset.json.
# Nomes de coluna herdados do UNSW-NB15, mas as definicoes do UNSW NAO foram assumidas:
# cada unidade abaixo foi medida ou marcada como TODO: confirmar.
#
# origem:     flow | alert | http | derivada | desconhecida
# como_obter: direto | converter | derivada | calcular_janela | indisponivel_no_eve | nao_reproduzivel | confirmar
# uso:        feature | rotulo | identificador | descartar | decidir
# certeza (em observacao): alta | media | baixa | nao verificado
#
# ATENCAO: este arquivo descreve o dataset COMO ELE ESTA, inclusive os defeitos.
# Ele ainda NAO prova que o extrator ao vivo reproduz estas colunas.
version: v0
status: draft
extractor: suricata
extractor_version: TODO
ruleset_version: TODO
dataset: rebsonramalho/network-threat-detection-dataset
dataset_version: TODO
data_da_medicao: '2026-11-15'
fonte_das_medicoes: scripts/inspeciona_dataset.py + docs/inspecao_dataset.json
verificacao_independente: scripts/verifica_numeros_chave.py + docs/verificacao_numeros_chave.json
amostra_medida:
  Dataset_completo.csv:
    linhas: 368017
    colunas: 29
  Dataset_resumido.csv:
    linhas: 55826
    colunas: 25
  observacao: Nenhuma celula vazia no completo. No resumido, vazio representa ausencia (NaN); no completo
    a ausencia foi preenchida com 0/'0'.
convencoes:
  certeza: 'Quando aplicavel, a certeza do mapeamento para o eve.json esta escrita no inicio da observacao:
    alta, media, baixa, nao verificado.'
  sentinela: O valor 0 (ou '0', '0.0') e usado como ausencia em varias colunas; nao e um zero medido.
  zeros: Em colunas textuais, zeros_completo conta o literal '0' (sentinela), nao um zero numerico medido.
  unidade_dur: segundos, confirmado por dur == Ltime - Stime nas linhas ISO-8601.
  unidade_load: bytes/s, confirmado por Sload == sbytes/dur e Dload == dbytes/dur.
  blocos: 'A = proto nomeado + Stime=0 (22.957); B = proto nomeado + Stime preenchido (32.869);
    C = proto numerico (312.191).'
  bloco_presente: 'Lista os blocos (A, B, C) em que a coluna tem valores nao-sentinela em pelo menos 10%
    das linhas do bloco, ou em que a coluna e estrutural/constante do bloco. [] = constante ou ausente em
    todos os blocos.'
evidencias_suricata:
- service usa o vocabulario de app_proto do Suricata (http, dns, tls, ftp, ssh, smb, rfb, smtp, telnet,
  dhcp, ntp, failed).
- state usa new/closed/established, subconjunto dos valores de flow.state do Suricata.
- As linhas com metodo/URL em trans_depth/res_bdy_len tem a forma de um evento http do eve.json.
- Os timestamps ISO-8601 tem o formato de datetime do Python com fuso (+00:00), consistente com transformacao
  de flow.start/flow.end.
- 'CONTRA-EVIDENCIA: 84,8% das linhas tem proto numerico (6/17/1/2), incompativel com o proto textual
  do eve.json, e Spkts=1/Dpkts=0. Isso indica que o completo concatena uma fonte diferente (bloco C).'
problemas_na_amostra:
- trans_depth contem metodo HTTP em 21.233 linhas e res_bdy_len contem URL nas mesmas 21.233 linhas (94,2%
  dos valores nao sao 0).
- Nao ha nenhum valor numerico > 0 em trans_depth nem em res_bdy_len; as duas colunas, como estao, nao
  servem como features numericas.
- 'O completo mistura 3 blocos: A (22.957 linhas, HTTP sem metricas de fluxo, 10,6% Label=1), B (32.869,
  fluxo real, 82,5% Label=1) e C (312.191, proto numerico, Spkts=1, Dpkts=0, dur=0, state=0, 98,4% Label=1).'
- O bloco C, com 84,8% das linhas, tem apenas 33.975 5-tuplas unicas e todas as features de fluxo zeradas
  ou constantes (Spkts=1, Dpkts=0, dur=0).
- 91,2% das linhas tem dur=0; 6,2% tem todas as features de fluxo zero (bloco A).
- 'Ltime == Stime em todas as 312.191 linhas do bloco epoch: nesse bloco Ltime nao e fim de fluxo.'
- '393 linhas tem dur=0 e Sload != 0; nelas Sload == sbytes (divisao nao aplicada). Ex.: IPv6-ICMP, 70
  bytes, Sload=70.'
- Sload/Dload sao bytes/s (nao bits/s como no UNSW).
- ct_state_ttl carrega nomes de estado TCP (syn_sent, fin_wait2, close_wait...), nao uma contagem por
  TTL.
- synack e ackdat sao booleanos (0/True/False), nao tempos em segundos; no resumido so existe True/vazio.
- sttl, swin, stcpb e dtcpb sao zero em 100% dos blocos A e B; so tem valores no bloco C.
- stcpb == dtcpb em 94,4% das linhas, o que e incompativel com numeros de sequencia independentes.
- is_sm_ips_ports e constante 0 em 368.017 linhas.
- 4 linhas tem varios valores no mesmo campo (srcip='a,b', dstip='b,a', sttl='64,52', proto='1,17').
- 5.572 linhas sao duplicatas exatas; 5.567 delas estao no bloco A.
- proto mistura nomes (TCP/UDP) e codigos (6/17/1) na mesma coluna.
- Stime mistura epoch e ISO-8601 na mesma coluna; Ltime tambem.
- Label=1 em 91,5% do completo, mas 52,9% no resumido; a proporcao depende do bloco.
- 'SEMANTICA DO LABEL (fonte: descricao do Kaggle): 1 = ataque, 0 = benigno. Os totais conferem com a
  medicao: completo 336.735 ataque / 31.282 benigno; resumido 29.546 / 26.280.'
- 'O dataset so tem Label binario: NAO permite analise por tipo de ataque (classe/categoria).'
- 'HIPOTESE (nao fato) sobre o bloco C: ele viria da captura de pacotes (tcpdump/tshark, 1 pacote por
  linha), nao do eve.json do Suricata. O ambiente teria Suricata + captura + merge temporal em Python.
  TODO: confirmar com o grupo.'
- 'Rede: os CSVs usam 192.168.56.x (Host-Only; 7 IPs distintos). NAO ha nenhum IP 10.0.0.x. Ha, porem,
  305 ocorrencias de 10.0.3.x (10.0.3.15 e 10.0.3.3) que precisam de explicacao, pois a faixa 10.0.0.x
  (Bridge) teria sido excluida.'
nao_reproduziveis:
# NOTA: "nao reproduzivel" aqui significa NAO reproduzivel SO com o eve.json. O ambiente informado
# tambem tem captura de pacotes (tcpdump/tshark) e merge temporal em Python; parte destas colunas
# pode ser derivada do PCAP e precisa ser confirmada (TODO: confirmar com o grupo).
- coluna: sttl
  motivo: O evento flow do eve.json nao expoe TTL. Exigiria PCAP (ou event_type packet com bytes);
    via tcpdump/tshark e derivavel em principio (TODO confirmar).
  classificacao: indisponivel_no_eve
- coluna: swin
  motivo: O evento flow nao expoe janela TCP; o objeto tcp do eve.json traz flags/estado, nao window.
    Exigiria PCAP; via tshark e derivavel em principio (TODO confirmar).
  classificacao: indisponivel_no_eve
- coluna: stcpb
  motivo: Nao ha seq base no flow do eve.json e os valores do dataset (0/1/449...) nao parecem numero
    de sequencia. Exigiria PCAP/tshark (TODO confirmar) e a unidade continua desconhecida.
  classificacao: nao_reproduzivel
- coluna: dtcpb
  motivo: Mesmo caso de stcpb; 94,4% das linhas tem stcpb == dtcpb. Exigiria PCAP/tshark (TODO confirmar).
  classificacao: nao_reproduzivel
- coluna: synack
  motivo: E o intervalo SYN->SYN-ACK, que nao existe no eve.json (booleano no dataset). Exigiria
    timestamps de pacote (PCAP/tshark), derivavel em principio (TODO confirmar).
  classificacao: nao_reproduzivel
- coluna: ackdat
  motivo: E o intervalo SYN-ACK->ACK, que nao existe no eve.json (booleano no dataset). Exigiria
    timestamps de pacote (PCAP/tshark), derivavel em principio (TODO confirmar).
  classificacao: nao_reproduzivel
- coluna: trans_depth
  motivo: Suricata nao expoe profundidade de transacao HTTP; alem disso a coluna do dataset contem o metodo
    HTTP.
  classificacao: nao_reproduzivel
- coluna: ct_state_ttl
  motivo: A coluna do dataset contem estado TCP detalhado; nao ha campo equivalente no eve.json nem a
    definicao de contagem por TTL do UNSW pode ser aplicada.
  classificacao: nao_reproduzivel
