services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ids}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ids-sensor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["tail", "-f", "/dev/null"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata-logs:/var/log/suricata
      - ./captures:/captures
    working_dir: /app

  tools:
    image: ghcr.io/astral-sh/ruff:0.8.6
    profiles: ["tools"]
    environment:
      RUFF_CACHE_DIR: /tmp/.ruff_cache
    volumes:
      - .:/repo
    working_dir: /repo

volumes:
  pgdata:
  redisdata: